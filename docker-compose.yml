services:
  clearscript-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=${CONFIG_PATH:-/root/config/local.yml}
      - APP_VERSION=${APP_VERSION:-dev}
    volumes:
      # Конфиги: локальные или внешние через переменную окружения
      - ${HOST_CONFIG_PATH:-./config}:/root/config:ro
    restart: unless-stopped
    container_name: clearscript-api-gateway