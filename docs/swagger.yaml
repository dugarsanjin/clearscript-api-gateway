basePath: /api/v1
definitions:
  get.Author:
    properties:
      email:
        type: string
      fullName:
        type: string
      id:
        type: string
    type: object
  get.Letter:
    properties:
      final:
        type: string
      initial:
        type: string
      medial:
        type: string
      transliteration:
        type: string
    type: object
  get.Permission:
    properties:
      actions:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  internal_http_handlers_content_get.Response:
    properties:
      author:
        $ref: '#/definitions/get.Author'
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      letter:
        $ref: '#/definitions/get.Letter'
      title:
        type: string
      updatedAt:
        type: string
    type: object
  internal_http_handlers_user_get.Response:
    properties:
      email:
        type: string
      fullName:
        type: string
      id:
        type: string
      permissions:
        items:
          $ref: '#/definitions/get.Permission'
        type: array
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a Go-based API gateway for ClearScript application.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: ClearScript API Gateway
  version: "1.0"
paths:
  /lessons/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve lesson content by lesson ID
      parameters:
      - description: Lesson ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers_content_get.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get lesson by ID
      tags:
      - lessons
  /users/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve user information by user ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers_user_get.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user by ID
      tags:
      - users
schemes:
- http
- https
swagger: "2.0"
