basePath: /clearscript-api-gateway
definitions:
  handlers.Author:
    properties:
      email:
        type: string
      fullName:
        type: string
      id:
        type: string
    type: object
  handlers.CompareResponse:
    properties:
      similarity:
        type: number
    type: object
  handlers.ContentGetResponse:
    properties:
      author:
        $ref: '#/definitions/handlers.Author'
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      letter:
        $ref: '#/definitions/handlers.Letter'
      title:
        type: string
      updatedAt:
        type: string
    type: object
  handlers.Letter:
    properties:
      final:
        type: string
      initial:
        type: string
      medial:
        type: string
      transliteration:
        type: string
    type: object
  handlers.Permission:
    properties:
      actions:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handlers.UserGetResponse:
    properties:
      email:
        type: string
      fullName:
        type: string
      id:
        type: string
      permissions:
        items:
          $ref: '#/definitions/handlers.Permission'
        type: array
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a Go-based API gateway for ClearScript application.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: ClearScript API Gateway
  version: "1.0"
paths:
  /api/v1/compare:
    post:
      consumes:
      - multipart/form-data
      description: Compare the uploaded input file against the provided template and
        return similarity score
      parameters:
      - description: Template file
        in: formData
        name: template
        required: true
        type: file
      - description: Input file to compare
        in: formData
        name: input
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CompareResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Compare input file with template
      tags:
      - compare
  /api/v1/lessons/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve lesson content by lesson ID
      parameters:
      - description: Lesson ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ContentGetResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get lesson by ID
      tags:
      - lessons
  /api/v1/users/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve user information by user ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserGetResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user by ID
      tags:
      - users
schemes:
- http
- https
swagger: "2.0"
